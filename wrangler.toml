name = "release-download-stats"
main = "platforms/cloudflare/worker.ts"
compatibility_date = "2026-10-01"

[vars]
REPOSITORIES = '[{"id":"fnmusic-sync","provider":"github","repository":"dtapps/fnmusic-sync"}]'
# Add more repository objects to the JSON array above.
# Set secrets with: wrangler secret put GITHUB_TOKEN / SYNC_SECRET
# CNB targets require a verified releasesUrl field in each JSON object.

[[kv_namespaces]]
binding = "STATS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["17 * * * *"]