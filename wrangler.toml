name = "release-download-stats"
main = "platforms/cloudflare/worker.ts"
compatibility_date = "2026-10-01"

[vars]
REPOSITORY = "dtapps/fnmusic-sync"
# Set CNB_RELEASES_URL to the exact verified Releases API URL from CNB OpenAPI.
# Never put tokens in this file; use wrangler secret put.

[[kv_namespaces]]
binding = "STATS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["17 * * * *"]