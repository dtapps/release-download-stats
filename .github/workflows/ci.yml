name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          check-latest: true
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - run: npm install
      - run: npm run typecheck
      - run: npm test